# SOL-Watch settings. Copy this file to settings.ini (next to sol_watch.py) and change what you like.
# Every line is optional: delete it or leave it commented out (# in front) for the default shown.
# An upgrade never replaces settings.ini. Secrets (API key, webhooks) stay in .env, not here.
# After a change, restart the bridge. A value it can't use is reported in the log, and its default kept.

[contracts]
# Which tiers of contract offers to post: newcomer (all), mid (hides newcomer offers) or leader (only leader).
# Faction and special offers, which have no tier, are always posted.
# tier_filter = mid

# The easiest faction alliance job worth posting: easy, medium or hard.
# alliance_job_min_level = easy
# This many new alliance jobs arriving at once are posted as one digest.
# alliance_job_digest_at = 3

[alerts]
# Warn this many real hours before something runs out or fills up (crew supplies, stocks, storage).
# 1 game day = 1 real hour, so these match the game's own warnings.
# countdown_warnings_hours = 72, 48, 24, 12, 4, 1

# Real minutes of warning before research completes, and before a diplomacy offer waiting on us expires.
# research_warning_minutes = 5
# deal_expiry_warning_minutes = 60

# A site that stalls again within this many real hours isn't posted again.
# stall_repeat_hours = 6
# Production stalls that are your own choice, never posted.
# ignored_stall_reasons = paused, keepLimit

# Post the full faction standings table when any one standing moves at least this much.
# standing_alert_step = 1.0

# Times of day (in irl_timezone) for the short "still running" status post, as many as you like, or off.
# If one stops arriving, the bridge or its machine is down. Each post covers the time since the last one.
# status_times = 08:00

# Post each new build of the game (yes), or only log it (no). A change to the API is posted either way.
# game_update_posts = no

[incoming]
# Rival warships heading for Earth and Moon space (no fighting allowed there) are only logged: yes.
# ignore_earth_moon = yes
# More places where arriving warships aren't posted, by place id, e.g. pallas/b, ceres/a
# ignore_places =
# Companies whose fleets never count as a threat, by name.
# ignore_companies = UEG Navy

[derelicts]
# How often to look for other companies' valuable derelicts, in minutes (at least 10). Each look downloads
# the whole craft map (about 1.3 MB). off turns it off, and the map is then never downloaded.
# check_minutes = 60
# The smallest salvage value to post, in $M.
# min_value = 500

[time]
# Time zone for the log files and the daily status hour, e.g. Europe/London or America/New_York.
# Empty: the machine's own zone. (Discord shows real times in each viewer's own zone anyway.)
# irl_timezone =

[updates]
# Check GitHub once a day for a newer version of the bridge, and post when there is one: yes or no.
# update_check = yes
# For a fork: your own project page, and the raw address of your sol_watch.py.
# project_url = https://github.com/Jomangork/sol-watch-bridge
# source_url = https://raw.githubusercontent.com/Jomangork/sol-watch-bridge/main/sol_watch.py

[intervals]
# Seconds between checks of each part of the API (at least 10). The defaults use about 21 of the
# API's 60 reads a minute per key; the bridge warns if your intervals add up to more than 40.
# chat = 15
# craft = 20
# fleet_map = 30
# mining = 45
# contracts = 60
# research = 60
# defense = 60
# company = 60
# fleets = 60
# diplomacy = 60
# history = 120
# industry = 300
# slow = 300        # factions, alliance, discoveries, daily gift
# news = 300
# pad_goals = 300
# records = 600
# api_spec = 3600
# game_site = 300
